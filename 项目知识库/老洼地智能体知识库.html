<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="老洼地煤矿配电网运行健康监测智能体的开发路线、现场资料、代码和验收清单。">
<title>老洼地智能体 · 项目知识库</title>
<style>
:root {
  color-scheme: light;
  --page:#f2f5f7; --card:#fff; --line:#dce4e9; --ink:#182833; --sub:#516571;
  --dark:#10232e; --dark-2:#193340; --mint:#6adac8; --teal:#09685d; --soft:#e5f4f1;
  --blue:#315779; --amber:#795017; --radius:16px;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
}
* {box-sizing:border-box}
html {scroll-behavior:smooth}
body {margin:0;background:var(--page);color:var(--ink);line-height:1.65;font-size:1rem}
button,input,textarea,select {font:inherit}
button,select {cursor:pointer}
button:disabled {cursor:default}
a {color:var(--teal);text-underline-offset:3px}
a:hover {color:#074c45}
[hidden] {display:none!important}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible {outline:3px solid #2d988a;outline-offset:3px}
h1,h2,h3,p,figure {margin:0}
h1,h2,h3 {line-height:1.27;text-wrap:balance}
h1 {font-size:clamp(2.05rem,4.3vw,3.45rem);letter-spacing:-.045em}
h2 {font-size:1.65rem;letter-spacing:-.025em}
h3 {font-size:1.06rem}
code,.mono {font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
.skip {position:absolute;left:12px;top:-70px;background:#fff;padding:10px;z-index:20}
.skip:focus {top:4px}
.layout {display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side {background:var(--dark);color:#e6eff2;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 16px 22px;z-index:5}
.brand {display:flex;gap:12px;align-items:center;margin:0 7px 34px}
.mark {width:42px;height:42px;border:1px solid #4d8a85;border-radius:12px;background:#1e4a4b;display:grid;place-items:center;color:#a4f2e3;font-size:1.35rem;font-weight:700}
.brand strong {display:block;font-size:1.08rem}
.brand span:last-child {display:block;font-size:.85rem;color:#b2c5cc}
.nav-label {font-size:.85rem;color:#abbdc6;margin:0 12px 8px}
.menu {display:grid;gap:4px}
.nav-btn {display:flex;align-items:center;gap:11px;border:1px solid transparent;background:none;color:#dbe9ee;padding:11px 12px;border-radius:10px;text-align:left;width:100%}
.nav-btn:hover {background:#213d49}
.nav-btn[aria-current="page"] {background:#244652;border-color:#3d6370;color:#f6fcff;font-weight:650}
.nav-icon {width:19px;text-align:center;color:#91d9ca;font-size:1.05rem}
.side-foot {margin-top:auto;padding:14px 8px 0;border-top:1px solid #364f5a}
.side-foot a {display:block;color:#bbeddf;font-size:.89rem;margin:8px 0 13px}
.side-foot p {font-size:.83rem;color:#b7c8cf}
.side-actions {display:flex;gap:6px;flex-wrap:wrap}
.side-actions button {border:1px solid #4a6570;color:#e6f1f3;background:none;padding:5px 8px;border-radius:7px;font-size:.81rem}
.side-actions button:hover {background:#294a58}
.main {min-width:0}
.top {position:sticky;top:0;z-index:4;background:#f2f5f7f2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.top-inner {display:flex;align-items:center;justify-content:space-between;gap:14px;max-width:1450px;margin:auto;padding:13px 34px}
.crumbs {display:flex;align-items:center;gap:9px;white-space:nowrap;font-size:.89rem;color:var(--sub)}
.crumbs strong {color:var(--ink)}
.crumbs i {font-style:normal;color:#8a9aa4}
.search-box {display:flex;align-items:center;gap:9px;min-width:0;width:min(390px,52%);background:#fff;border:1px solid #ccd9e0;border-radius:10px;padding:7px 11px;color:var(--sub)}
.search-box input {min-width:0;width:100%;height:25px;border:none;background:transparent;color:var(--ink);padding:0;font-size:.92rem;outline:none}
.search-box:focus-within {border-color:#3b8b80;box-shadow:0 0 0 2px #cbe9e3}
.search-box input:focus-visible {outline:none}
kbd {border:1px solid #d4e0e5;border-radius:5px;padding:0 5px;background:#f4f7f8;color:#48616f;font-size:.76rem;white-space:nowrap}
.btn.mobile-nav {display:none}
.wrap {max-width:1450px;padding:26px 34px 46px;margin:auto}
.hero {display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.85fr);overflow:hidden;border:1px solid #d6e4e7;border-radius:20px;background:linear-gradient(128deg,#f9fcfa,#e5f1ef);box-shadow:0 5px 18px #112f4210}
.hero-copy {padding:23px clamp(23px,4vw,48px);display:grid;align-content:center;gap:10px}
.overline {display:flex;align-items:center;gap:8px;color:var(--teal);font-size:.87rem;font-weight:700;letter-spacing:.08em}
.overline::before {content:"";display:inline-block;width:19px;height:2px;background:#289585}
.hero-copy > p:not(.overline) {max-width:38em;color:#3d5a63;font-size:1.03rem}
.hero-actions {display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
.btn {display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #c7d8dc;color:#24515b;background:#fff;padding:8px 12px;border-radius:8px;font-weight:650;font-size:.89rem;text-decoration:none}
.btn:hover {background:#eff7f6;color:#14423d}
.btn.primary {background:#166b61;border-color:#166b61;color:#fff}
.btn.primary:hover {background:#09594f}
.btn.ghost {background:transparent;border-color:#bdcfd0}
.btn.small {font-size:.81rem;padding:5px 9px}
.diagram {min-width:0;background:#14323b;color:#daeef0;padding:25px 25px 20px;display:grid;align-content:center;gap:13px;background-image:radial-gradient(#6da39938 1px,transparent 1px);background-size:18px 18px}
.diagram figcaption {font-size:.86rem;color:#aae6da;font-weight:650;letter-spacing:.08em}
.diagram-row {display:grid;grid-template-columns:1fr 12px 1fr;gap:6px;align-items:center}
.diagram-node {background:#214754;border:1px solid #47727a;border-radius:9px;padding:9px 10px;line-height:1.35;min-width:0}
.diagram-node strong {display:block;color:#f1faf8;font-size:.94rem;margin-bottom:3px}
.diagram-node span {display:block;font-size:.79rem;color:#bbdadd}
.connector {height:1px;background:#7db8ad}
.diagram-note {color:#c4dddf;font-size:.82rem}
.metrics {display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;background:white;margin:15px 0 0}
.metric {display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 8px;min-width:0}
.metric:not(:last-child) {border-right:1px solid var(--line)}
.metric strong {color:#165850;font-size:1.35rem;font-variant-numeric:tabular-nums}
.metric span {font-size:.88rem;color:var(--sub)}
.now {margin:16px 0 20px;border-left:3px solid #42a993;padding:8px 14px;background:#e8f3ef;color:#2c5151;font-size:.91rem}
.now strong {color:#17423b}
.page-title {margin:0 0 20px}
.page-title h1 {font-size:2rem}
.page-title p {color:var(--sub);margin-top:6px;max-width:62em}
.route-title {display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 13px}
.route-title label {color:var(--sub);font-size:.88rem}
select {appearance:none;border:1px solid #cbd9dc;border-radius:8px;padding:6px 32px 6px 9px;color:var(--ink);background:linear-gradient(45deg,transparent 50%,#566f78 50%) calc(100% - 15px) 52%/6px 6px no-repeat,linear-gradient(135deg,#566f78 50%,transparent 50%) calc(100% - 9px) 52%/6px 6px no-repeat,#fff}
.board {display:grid;grid-template-columns:minmax(245px,.78fr) minmax(0,1.85fr);gap:17px;align-items:start}
.timeline,.detail,.module {background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.timeline {padding:12px 8px}
.group-name {color:var(--sub);font-size:.85rem;padding:7px 10px 3px;font-weight:650}
.stage-btn {display:grid;grid-template-columns:32px minmax(0,1fr);gap:7px;width:100%;border:1px solid transparent;background:#fff;text-align:left;padding:8px 7px;border-radius:9px;color:var(--ink);align-items:start}
.stage-btn:hover {background:#f0f7f6}
.stage-btn[aria-current="step"] {background:#e7f5f1;border-color:#b4ded4}
.stage-n {font-size:.78rem;color:#38645f;padding:3px 4px;text-align:center;background:#edf4f5;border-radius:5px;font-variant-numeric:tabular-nums}
.stage-btn[aria-current="step"] .stage-n {background:#d2eae5}
.stage-label {font-size:.94rem;font-weight:670;display:block;line-height:1.38;margin:0 0 3px}
.stage-meta {display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.badge {display:inline-flex;white-space:nowrap;padding:0 7px;border-radius:5px;font-size:.79rem;font-weight:650;line-height:1.65;background:#eef2f4;color:#405764}
.badge.done {background:#dbf0e7;color:#1a634d}
.badge.prototype {background:#eaf0f8;color:#2e567d}
.badge.paused {background:#fff0d7;color:#71470e}
.badge.pending {background:#edf1f4;color:#485e68}
.badge.optional {background:#edeafb;color:#584573}
.badge.defined {background:#e2f1f1;color:#315e60}
.route-checked {color:#56716c;font-size:.77rem}
.detail {overflow:hidden;scroll-margin-top:77px}
.detail-head {padding:21px 23px 17px;background:#fbfdfd;border-bottom:1px solid #e2e9ea}
.detail-head .meta {display:flex;gap:8px;align-items:center;color:var(--sub);font-size:.84rem;margin-bottom:8px}
.detail-head p {color:var(--sub);margin-top:7px}
.detail-body {padding:18px 23px;display:grid;gap:17px}
.detail-body section {min-width:0}
.detail-body section p {margin-top:5px}
.detail-body .block + .block {border-top:1px solid #e7edef;padding-top:12px}
.deps {font-size:.87rem;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dep {border:0;background:#eff5f6;color:#285d63;border-radius:6px;padding:2px 7px}
.dep:hover {background:#ddeceb}
.readings {display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.chapter-link {display:inline-flex;gap:6px;align-items:center;border-radius:8px;padding:4px 8px;border:1px solid #ccdedf;background:#f5f9f8;text-decoration:none;font-size:.86rem}
.chapter-link:hover {background:#e3f1ed}
.checklist {border:1px solid #dae8e3;border-radius:10px;background:#f8fbfa;overflow:hidden;margin-top:7px}
.checklist label {display:flex;gap:9px;align-items:flex-start;padding:8px 11px;font-size:.94rem;cursor:pointer}
.checklist label+label {border-top:1px solid #e3ebe7}
.checklist input {accent-color:#166b61;width:17px;height:17px;margin:4px 0 0;flex:none}
.check-info {margin-top:4px;color:var(--sub);font-size:.84rem}
.filelist {display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.filelist li {display:flex;gap:9px;align-items:center;justify-content:space-between;border-bottom:1px dashed #dae6e9;padding:4px 0}
.filelist a {overflow-wrap:anywhere;font-size:.91rem}
.notes {border-top:1px solid #e4eded;padding-top:14px}
.notes-row {display:flex;align-items:center;justify-content:space-between;gap:8px}
textarea {display:block;width:100%;resize:vertical;min-height:93px;margin:8px 0 0;padding:9px;border:1px solid #cddcdd;background:#fbfdfd;border-radius:8px;color:var(--ink);font-size:.94rem}
.saved {color:var(--sub);font-size:.82rem}
.empty {color:var(--sub);padding:17px}
.chapter-grid,.verify-grid,.search-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.module {padding:17px}
.module-head {display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.module p {margin-top:7px;color:#354e5a}
.module .meta {font-size:.86rem;color:var(--sub)}
.module .actions {display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.module .applied {border-top:1px solid var(--line);margin-top:10px;padding-top:9px}
.update-list {display:grid;gap:12px;max-width:52rem}
.update-list time {color:var(--sub);font-size:.87rem;white-space:nowrap}
.tip-panel {margin-bottom:17px;border:1px solid #d0e5df;padding:13px 15px;border-radius:10px;background:#e9f5f1;color:#2c5150}
.verify-grid {align-items:start}
pre {user-select:text;white-space:pre-wrap;overflow-wrap:anywhere;background:#172e38;color:#e5f3ef;border-radius:9px;padding:12px;font-size:.86rem;line-height:1.6;margin:10px 0}
.case {margin-top:16px}
.case table {width:100%;border-collapse:collapse;margin-top:9px;font-size:.91rem}
.case th,.case td {text-align:left;border:1px solid #dce6e9;padding:7px 9px}
.case th {background:#edf5f4;color:#294e53}
.archive-list {display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.archive-list details {min-width:0;padding:0}
.archive-list summary {padding:10px 16px;color:var(--ink);cursor:pointer}
.archive-list summary span {margin-left:9px;color:var(--sub);font-size:.86rem}
.archive-list summary:focus-visible {outline:3px solid #2d988a;outline-offset:2px;border-radius:10px}
.archive-report {padding:0 16px 15px}
.archive-report .actions {margin:8px 0}
.archive-table {overflow:auto;max-height:355px;border:1px solid var(--line);border-radius:8px}
.archive-table table {width:100%;border-collapse:collapse;font-size:.87rem;font-variant-numeric:tabular-nums}
.archive-table th,.archive-table td {padding:5px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.archive-table thead {position:sticky;top:0;background:#edf5f4}
.archive-table small {margin-left:6px;color:var(--sub)}
.archive-figures {margin-top:20px}
.archive-figures img {display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
.archive-figures figcaption {margin-top:7px;color:var(--sub);font-size:.88rem}
.toast {position:fixed;bottom:20px;right:22px;z-index:10;background:#13343c;color:#fff;padding:10px 15px;border-radius:9px;max-width:min(32rem,calc(100vw - 35px));box-shadow:0 4px 20px #172e3850}
footer {margin-top:24px;color:var(--sub);font-size:.86rem}
@media(max-width:1100px) {
 .layout {grid-template-columns:202px minmax(0,1fr)}
 .top-inner,.wrap {padding-left:20px;padding-right:20px}
 .diagram {padding:18px 14px}
 .hero {grid-template-columns:minmax(0,1fr) minmax(250px,.80fr)}
 .board {grid-template-columns:minmax(205px,.78fr) minmax(0,1.6fr)}
}
@media(max-width:820px) {
 .layout {display:block}
 .side {display:none;position:fixed;top:54px;bottom:0;height:auto;width:min(290px,86vw);box-shadow:14px 0 36px #122e3540}
 .side.open {display:flex}
 .btn.mobile-nav {display:inline-flex}
 .top-inner,.wrap {padding-left:15px;padding-right:15px}
 .top-inner {padding-top:8px;padding-bottom:8px}
 .crumbs > span,.crumbs i {display:none}
 .search-box {width:min(360px,62%)}
}
@media(max-width:605px) {
 .hero,.board,.chapter-grid,.search-grid,.verify-grid {grid-template-columns:minmax(0,1fr)}
 .hero-copy {padding:21px}
 .hero h1 {font-size:2.22rem}
 .diagram {padding:12px 16px}
 .diagram-row {gap:5px}
 .diagram-node {padding:6px 8px}
 .metric {flex-direction:column;gap:0;text-align:center;line-height:1.35}
 .metric strong {font-size:1.16rem}
 .metric span {font-size:.76rem}
 .wrap {padding-top:15px}
 .crumbs strong,kbd {display:none}
 .search-box {width:100%}
 .detail-head,.detail-body {padding-left:15px;padding-right:15px}
 .timeline {display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
 .group-name {grid-column:1/-1}
 .stage-label {font-size:.87rem}
 .filelist .btn {flex:none}
}
@media(prefers-reduced-motion:reduce) {html {scroll-behavior:auto}}
</style>
</head>

</div>

<script src="./资料/老洼地/archive-data.js"></script>
<script>
"use strict";
const {chapters, phases, updates} = JSON.parse(document.getElementById("source-data").textContent);
const statuses = {
  defined:"口径已定", done:"离线档案已复验", prototype:"已有原型", paused:"暂缓",
  pending:"待建设", optional:"按需对照"
};
const viewLabels = {roadmap:"构建路线",monitoring:"监测方案",materials:"现场资料",chapters:"教程索引",checks:"复验台",updates:"更新记录"};
const phaseById = new Map(phases.map(phase => [phase.id, phase]));
const chapterByNumber = new Map(chapters.map(chapter => [chapter.n, chapter]));
const storageKey = "laowadi-project-library-v1";
const view = document.getElementById("view");
const search = document.getElementById("search");
const sidebar = document.getElementById("sidebar");
const mobileMenu = document.getElementById("menu-toggle");
const importFile = document.getElementById("import-file");
const pageName = document.getElementById("view-name");
const toast = document.getElementById("toast");
const isMobile = window.matchMedia("(max-width: 605px)");
let state = loadState();
let selection = "all";
let route = readRoute();
let announcement;

const escape = value => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const number = phase => String(phase.n).padStart(2,"0");
const badge = kind => '<span class="badge '+kind+'">'+statuses[kind]+'</span>';
const fileHref = path => "../"+path.split("/").map(encodeURIComponent).join("/");
const archiveHref = name => "./资料/老洼地/"+encodeURIComponent(name);
const phaseUrl = id => "#stage/"+id;
const external = (url, name, className = "") =>
  '<a class="'+className+'" href="'+escape(url)+'" target="_blank" rel="noreferrer">'+escape(name)+'</a>';

function normalizeState(candidate) {
  const clean = {version:1,lastStage:"agent-loop",notes:{},checked:{}};
  if (!candidate || candidate.version !== 1) return clean;
  if (phaseById.has(candidate.lastStage)) clean.lastStage = candidate.lastStage;
  for (const {id,checks} of phases) {
    if (typeof candidate.notes?.[id] === "string") clean.notes[id] = candidate.notes[id].slice(0,12000);
    if (Array.isArray(candidate.checked?.[id])) {
      clean.checked[id] = [...new Set(candidate.checked[id].filter(item => checks.includes(item)))];
    }
  }
  return clean;
}
function loadState() {
  try { return normalizeState(JSON.parse(localStorage.getItem(storageKey))); }
  catch { return normalizeState(null); }
}
function save() {
  try { localStorage.setItem(storageKey,JSON.stringify(state)); return true; }
  catch { return false; }
}
function announce(message) {
  window.clearTimeout(announcement);
  toast.textContent=message;
  toast.hidden=false;
  announcement=window.setTimeout(() => { toast.hidden=true; },3300);
}
function readRoute() {
  const hash=location.hash.slice(1);
  if (Object.hasOwn(viewLabels,hash) && hash!=="roadmap") return {page:hash,id:null};
  const [type,id]=hash.split("/");
  if (type==="stage" && phaseById.has(id)) return {page:"roadmap",id};
  if (type==="chapter" && chapterByNumber.has(Number(id))) return {page:"chapters",id:Number(id)};
  return {page:"roadmap",id:state.lastStage};
}
function closeMenu() {
  sidebar.classList.remove("open");
  mobileMenu.setAttribute("aria-expanded","false");
}
function go(page,id=null,{scroll="top",replace=false}={}) {
  route={page,id};
  if (page==="roadmap") {
    route.id=id || state.lastStage;
    state.lastStage=route.id;
    save();
    if (!visiblePhases().some(phase => phase.id===route.id)) selection="all";
  }
  const hash=page==="roadmap"?phaseUrl(route.id):id?"#chapter/"+id:"#"+page;
  if (location.hash!==hash) history[replace?"replaceState":"pushState"](null,"",hash);
  search.value="";
  closeMenu();
  const keepBoard = scroll==="keep" && !!document.getElementById("timeline");
  if (keepBoard) {
    renderBoard();
  } else {
    render();
  }
  const detail=document.getElementById("detail");
  if (scroll==="detail" || (keepBoard && detail?.getBoundingClientRect().top<75)) {
    detail?.scrollIntoView({block:"start",behavior:"instant"});
  }
  else if (scroll==="top") window.scrollTo({top:0,behavior:"instant"});
  if (page==="chapters" && id) document.getElementById("chapter-"+id)?.scrollIntoView({block:"start",behavior:"instant"});
}
function visiblePhases() {
  return selection==="all"?phases:phases.filter(phase => phase.status===selection);
}
function hero() {
  return '<section class="hero" aria-labelledby="welcome"><div class="hero-copy">'+
    '<p class="overline">开发路线与验收</p><h1 id="welcome">老洼地<br>智能体知识库</h1>'+
    '<p>围绕煤矿配电网运行健康监测，串起日常电力数据、主动反馈、值班问答和现场复核。</p>'+

    '<div class="diagram-row"><div class="diagram-node"><strong>事件归档</strong><span>规则与原表位置</span></div><span class="connector" aria-hidden="true"></span><div class="diagram-node"><strong>只读复核</strong><span>事件、整点与图示</span></div></div>'+

function renderTimeline() {
  const target=document.getElementById("timeline");
  if (!target) return;
  let group="";

      '<span class="stage-meta">'+badge(phase.status)+(count?'<span class="route-checked" aria-label="已勾选 '+count+' 项">'+count+'/'+phase.checks.length+'</span>':'')+'</span></span></button>';
  }).join("");
}
function phaseMarkup(phase) {
  const selected=state.checked[phase.id]||[];
  const sources=phase.files.map(([label,path],i) =>
    '<li>'+external(fileHref(path),label)+'<button class="btn small" type="button" data-copy-path="'+i+'" title="'+escape(path)+'">复制路径</button></li>').join("");
  const chaptersHtml=phase.refs.map(n => {
    const c=chapterByNumber.get(n);

    '<section class="block"><h3>怎样借鉴 Hello-Agents</h3><p>'+escape(phase.adapt)+'</p><div class="readings">'+chaptersHtml+'</div></section>'+

    '<section class="block"><h3>代码与项目文档</h3><ul class="filelist">'+sources+'</ul></section>'+
    '<section class="notes"><div class="notes-row"><h3><label for="stage-note">我的开发笔记</label></h3>'+
    '<button type="button" class="btn small" data-action="copy-task">复制开发单</button></div>'+
    '<textarea id="stage-note" maxlength="12000" placeholder="记下验收结果、改过的文件和下次要接着做的事。">'+escape(state.notes[phase.id]||"")+
    '</textarea><p class="saved" id="note-status">输入后保存到当前浏览器。</p></section></div>';
}
function renderBoard() {
  document.getElementById("filter").value=selection;
  document.querySelector(".hero [data-stage]").dataset.stage=state.lastStage;

  if (phase) document.getElementById("detail").innerHTML=phaseMarkup(phase);

}

    '<p>工作台使用已归档的老洼地历史数据。启动命令可在第 14 阶段查看，矿上连续接入和真实反馈时间待现场验证。</p>'+

function normalized(input) {
  return input.normalize("NFKC").toLowerCase().replace(/\s+/g," ");
}
function results(query) {
  const words=normalized(query).trim().split(" ").filter(Boolean);
  const matches=text => words.every(word => normalized(text).includes(word));
  const found=phases.filter(p => matches([p.title,p.brief,p.now,p.implementation,p.adapt,statuses[p.status],
    p.files.flat().join(" "), ...p.refs.map(n => "第"+n+"章 "+chapterByNumber.get(n).title),state.notes[p.id]||""].join(" ")));
  const books=chapters.filter(c => matches([c.title,c.lesson,c.use,"第"+c.n+"章","第 "+c.n+" 章"].join(" ")));
  const itemHtml=found.map(p => '<article class="module"><div class="module-head"><h3>'+escape(p.title)+'</h3>'+badge(p.status)+'</div>'+
    '<p>'+escape(p.brief)+'</p><div class="actions"><button class="btn small" type="button" data-stage="'+p.id+'" data-scroll="detail">打开开发卡</button></div></article>').join("");
  return '<header class="page-title"><h1>搜索结果</h1><p aria-live="polite">找到 '+found.length+' 个阶段和 '+books.length+' 个教程章节。</p></header>'+
    (found.length?'<div class="search-grid">'+itemHtml+'</div>':'')+
    (books.length?'<div class="route-title" style="margin-top:20px"><h2>相关章节</h2></div><div class="chapter-grid">'+chapterCards(books)+'</div>':'')+
    (!found.length&&!books.length?'<p class="module empty">试试输入 RAG、306 柜、LangGraph、章名或代码文件名。</p>':'');
}
function render() {

  pageName.textContent=query?"搜索":viewLabels[route.page];
  for (const button of sidebar.querySelectorAll("[data-route]")) {
    if (!query && button.dataset.route===route.page) button.setAttribute("aria-current","page");
    else button.removeAttribute("aria-current");
  }
  if (query) { view.innerHTML=results(query); return; }
  const pages = {roadmap:road,monitoring:monitoringPage,materials:materialsPage,chapters:chaptersPage,checks:checksPage,updates:updatesPage};
  view.innerHTML=pages[route.page]();
  if (route.page==="roadmap") renderBoard();
}
async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
    announce("已复制");
    return;
  } catch {
    const input=document.createElement("textarea");
    input.value=text;
    input.style.cssText="position:fixed;top:0;left:-2000px";
    document.body.append(input);
    const focused=document.activeElement;
    input.select();
    const copied=document.execCommand("copy");
    input.remove();
    focused?.focus();
    announce(copied?"已复制":"浏览器未开放剪贴板，请选取文字复制。");
  }
}
function taskSheet(phase) {
  const lines=["老洼地开发单 · "+phase.title,"项目状态　"+statuses[phase.status],"现状　"+phase.now,
    "实现　"+phase.implementation,"交付　"+phase.output,"验收",...phase.checks.map(s => "- "+s),
    "项目文件",...phase.files.map(([,path])=>"- "+path),
    "教程来源",...phase.refs.map(n => "- 第 "+n+" 章 "+chapterByNumber.get(n).url),
    "数据口径　后续校准和验收使用老洼地数据。"];
  if (state.notes[phase.id]) lines.push("个人笔记",state.notes[phase.id]);
  return lines.join("\n");
}
function exportNotes() {
  const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));
  const anchor=document.createElement("a");
  anchor.href=url;
  anchor.download="老洼地知识库笔记.json";
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(url),1500);
  announce("已生成笔记备份");
}
importFile.addEventListener("change", async () => {
  const file=importFile.files[0];
  importFile.value="";
  if (!file) return;
  try {
    if (file.size>1_000_000) throw Error();
    const raw=JSON.parse(await file.text());
    if (!raw || raw.version!==1 || (!raw.notes && !raw.checked)) throw Error();
    const incoming=normalizeState(raw);
    let skipped=0;
    for (const phase of phases) {
      const id=phase.id;
      if (!state.notes[id] && incoming.notes[id]) state.notes[id]=incoming.notes[id];
      else if (incoming.notes[id] && !state.notes[id].includes(incoming.notes[id])) {
        const combined=state.notes[id]+"\n\n—— 导入的笔记 ——\n"+incoming.notes[id];
        if (combined.length<=12000) state.notes[id]=combined;
        else skipped++;
      }
      if (incoming.checked[id]?.length) state.checked[id]=
        [...new Set([...(state.checked[id]||[]),...incoming.checked[id]])];
    }
    const saved=save();
    render();
    const savedMessage=saved?"备份已合并。":"备份已在本页合并，请重新导出保留。";
    announce(skipped?savedMessage+" 有 "+skipped+" 条超长笔记可从备份查看。":savedMessage);
  } catch { announce("无法导入，请选择本知识库导出的 JSON 备份。"); }
});
document.addEventListener("click", event => {
  const button=event.target.closest("button");
  if (!button) return;
  if (button===mobileMenu) {
    const open=sidebar.classList.toggle("open");
    mobileMenu.setAttribute("aria-expanded",String(open));
    return;
  }
  if (button.dataset.route) { go(button.dataset.route); return; }
  if (button.dataset.stage) {
    const inBoard=!!document.getElementById("timeline");
    const focus=isMobile.matches||button.dataset.scroll==="detail";
    go("roadmap",button.dataset.stage,{scroll:focus?"detail":inBoard?"keep":"top"});
    return;
  }
  if ("command" in button.dataset) { copy(commands[Number(button.dataset.command)].cmd);return; }
  const phase=phaseById.get(route.id);
  if ("copyPath" in button.dataset && phase) { copy(phase.files[Number(button.dataset.copyPath)][1]);return; }
  if (button.dataset.action==="copy-task" && phase) copy(taskSheet(phase));
  if (button.dataset.action==="export") exportNotes();
  if (button.dataset.action==="import") importFile.click();
});
document.addEventListener("change", event => {
  if (event.target.id==="filter") {
    selection=event.target.value;
    const shown=visiblePhases();
    if (shown.length && !shown.some(phase => phase.id===route.id)) go("roadmap",shown[0].id,{scroll:"keep",replace:true});
    else renderBoard();
  } else if ("check" in event.target.dataset) {
    const phase=phaseById.get(route.id);
    const label=phase.checks[Number(event.target.dataset.check)];
    const checked=new Set(state.checked[phase.id]||[]);
    if (event.target.checked) checked.add(label);
    else checked.delete(label);
    state.checked[phase.id]=[...checked];
    if (!save()) announce("此页无法写入本地存储，可备份勾选记录。");
    renderTimeline();
    document.getElementById("count-note").textContent=checked.size+" / "+phase.checks.length+" 项个人记录。阶段状态依据项目验收记录。";
  }
});
document.addEventListener("input", event => {
  if (event.target===search) {
    render();
    window.scrollTo({top:0,behavior:"instant"});
  } else if (event.target.id==="stage-note") {
    state.notes[route.id]=event.target.value;
    document.getElementById("note-status").textContent=save()?"已保存到当前浏览器。":"本页无法写入本地存储，可备份当前笔记。";
  }
});
document.addEventListener("keydown", event => {
  if ((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="k") {
    event.preventDefault();
    search.focus();
    search.select();
  } else if (event.key==="Escape") {
    if (search.value) { search.value="";render(); }
    else closeMenu();
  }
});
function restoreRoute() {
  route=readRoute();
  if (route.page==="roadmap" && !visiblePhases().some(phase => phase.id===route.id)) selection="all";
  search.value="";
  render();
  if (route.page==="chapters"&&route.id) document.getElementById("chapter-"+route.id)?.scrollIntoView({block:"start",behavior:"instant"});
}
window.addEventListener("popstate",restoreRoute);
window.addEventListener("hashchange",restoreRoute);
restoreRoute();
if (location.hash.startsWith("#stage/") && isMobile.matches) {
  document.getElementById("detail")?.scrollIntoView({block:"start",behavior:"instant"});
}
