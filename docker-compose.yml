services:
  minegrid-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minegrid-agent
    ports:
      - "8765:8765"
    environment:
      - COAL_API_BASE_URL=${COAL_API_BASE_URL:-}
      - COAL_API_MODEL=${COAL_API_MODEL:-deepseek-v4-pro}
      - COAL_API_KEY=${COAL_API_KEY:-}
    volumes:
      - minegrid_local:/app/研究实施/老洼地数据接入_20261119/local
    restart: unless-stopped

volumes:
  minegrid_local:
