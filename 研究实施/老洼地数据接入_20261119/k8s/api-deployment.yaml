apiVersion: v1
kind: Service
metadata:
  name: laowadi-api
  namespace: laowadi-power
  labels:
    app.kubernetes.io/name: laowadi-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8765
      targetPort: 8765
  selector:
    app.kubernetes.io/name: laowadi-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laowadi-api
  namespace: laowadi-power
  labels:
    app.kubernetes.io/name: laowadi-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: laowadi-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: laowadi-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8765"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: wait-for-archive
          image: laowadi/power-agent:2.4.0
          command: ["/app/scripts/wait-for-archive.sh"]
          envFrom:
            - configMapRef:
                name: laowadi-config
            - secretRef:
                name: laowadi-secrets
      containers:
        - name: api
          image: laowadi/power-agent:2.4.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "laowadi.asgi:app", "--host", "0.0.0.0", "--port", "8765", "--workers", "2"]
          ports:
            - name: http
              containerPort: 8765
          envFrom:
            - configMapRef:
                name: laowadi-config
            - secretRef:
                name: laowadi-secrets
          volumeMounts:
            - name: archive
              mountPath: /archive
              readOnly: true
            - name: backups
              mountPath: /backups
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8765
              httpHeaders:
                - name: Host
                  value: "localhost:8765"
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8765
              httpHeaders:
                - name: Host
                  value: "localhost:8765"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
              httpHeaders:
                - name: Host
                  value: "localhost:8765"
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: laowadi-archive-pvc
        - name: backups
          persistentVolumeClaim:
            claimName: laowadi-backups-pvc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: laowadi-api-hpa
  namespace: laowadi-power
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: laowadi-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: laowadi-api-pdb
  namespace: laowadi-power
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: laowadi-api
