apiVersion: v1
kind: Service
metadata:
  name: laowadi-redis
  namespace: laowadi-power
  labels:
    app.kubernetes.io/name: laowadi-redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: laowadi-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laowadi-redis
  namespace: laowadi-power
  labels:
    app.kubernetes.io/name: laowadi-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: laowadi-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: laowadi-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
