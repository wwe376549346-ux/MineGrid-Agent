apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laowadi-backups-pvc
  namespace: laowadi-power
  labels:
    app.kubernetes.io/name: laowadi-backup
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: laowadi-daily-backup
  namespace: laowadi-power
  labels:
    app.kubernetes.io/name: laowadi-backup
spec:
  schedule: "0 2 * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: laowadi-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: backup
              image: laowadi/power-agent:2.4.0
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -B
                - -m
                - laowadi
                - ops
                - backup
                - --output-dir
                - /backups
                - --retention-days
                - "14"
              envFrom:
                - configMapRef:
                    name: laowadi-config
                - secretRef:
                    name: laowadi-secrets
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: archive
                  mountPath: /archive
                  readOnly: true
              resources:
                requests:
                  cpu: "200m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: laowadi-backups-pvc
            - name: archive
              persistentVolumeClaim:
                claimName: laowadi-archive-pvc
