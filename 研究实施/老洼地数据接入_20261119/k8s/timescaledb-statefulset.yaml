apiVersion: v1
kind: Service
metadata:
  name: laowadi-timescaledb
  namespace: laowadi-power
  labels:
    app.kubernetes.io/name: laowadi-timescaledb
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: laowadi-timescaledb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: laowadi-timescaledb
  namespace: laowadi-power
  labels:
    app.kubernetes.io/name: laowadi-timescaledb
spec:
  serviceName: laowadi-timescaledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: laowadi-timescaledb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: laowadi-timescaledb
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: timescaledb
          image: laowadi/timescaledb-pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: laowadi-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laowadi-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
