[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laowadi-power-agent"
version = "2.2.0"
description = "Evidence-constrained coal mine distribution network health monitoring & neuro-symbolic AC power-flow diagnostic agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pandapower>=3.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
laowadi = "laowadi.__main__:main"

[tool.setuptools.packages.find]
include = ["laowadi*"]

[tool.setuptools.package-data]
laowadi = ["data/standards_corpus.json"]
